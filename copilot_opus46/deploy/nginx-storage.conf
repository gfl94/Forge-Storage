server {
    listen 443 ssl http2;
    server_name storage.example.com;

    # TLS – adjust paths to your certificates
    # ssl_certificate     /etc/letsencrypt/live/storage.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/storage.example.com/privkey.pem;

    root /var/www/storage-ui;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # Static frontend assets
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to Go backend
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Health check endpoints
    location /health {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
    }

    location /ready {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
    }

    # Nginx own health check
    location = /healthz-nginx {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Rate-limit login endpoint
    # Uncomment after defining the limit_req_zone in the http block:
    # limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    # location = /api/login {
    #     limit_req zone=login burst=3 nodelay;
    #     proxy_pass http://127.0.0.1:8081;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header X-Request-ID $request_id;
    # }
}
