<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storage Gateway - File Browser</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>Storage Gateway</h1>
            <div class="user-info">
                <span id="username"></span>
                <button id="logoutBtn" class="btn btn-secondary">Logout</button>
            </div>
        </header>

        <main class="app-main">
            <div class="toolbar">
                <div class="breadcrumb" id="breadcrumb"></div>
                <button id="uploadBtn" class="btn btn-primary">Upload File</button>
            </div>

            <div id="errorMessage" class="error-message" style="display: none;"></div>

            <div class="file-list-container">
                <table class="file-list" id="fileList">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Type</th>
                            <th>Size</th>
                            <th>Modified</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="fileListBody">
                        <tr>
                            <td colspan="5" class="loading">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div id="uploadModal" class="modal" style="display: none;">
                <div class="modal-content">
                    <h2>Upload File</h2>
                    <form id="uploadForm">
                        <div class="form-group">
                            <label for="fileInput">Select file</label>
                            <input type="file" id="fileInput" required>
                        </div>

                        <div class="form-group">
                            <label for="filePath">Upload path</label>
                            <input type="text" id="filePath" readonly>
                        </div>

                        <div id="uploadProgress" style="display: none;">
                            <div class="progress-bar">
                                <div id="progressFill" class="progress-fill"></div>
                            </div>
                            <p id="progressText">0%</p>
                        </div>

                        <div id="uploadError" class="error-message" style="display: none;"></div>

                        <div class="modal-actions">
                            <button type="button" id="cancelUploadBtn" class="btn btn-secondary">Cancel</button>
                            <button type="submit" class="btn btn-primary">Upload</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="api.js"></script>
    <script src="browser.js"></script>
    <script src="upload.js"></script>
    <script src="app.js"></script>
</body>
</html>
